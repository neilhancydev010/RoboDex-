<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" fill="none" role="img" aria-label="Supported Boards Architecture Overview">
  <rect width="760" height="220" rx="12" fill="#0C1729"/>
  <text x="380" y="34" text-anchor="middle" fill="#22D3EE" font-family="sans-serif" font-size="15" font-weight="700">RoboDex́ Supported Microcontroller Families — Logic Voltage &amp; Architecture</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="20" y="54" width="134" height="142" rx="8" fill="#13223B" stroke="#2B82FF" stroke-width="2"/>
